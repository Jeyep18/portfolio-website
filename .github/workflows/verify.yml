name: Verify portfolio
on:
  push:
    branches: [codex/portfolio-cloud-handoff]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs/redesign/prototypes/space-gallery/package-lock.json
      - run: node tests/site.test.mjs
      - run: npm ci
        working-directory: docs/redesign/prototypes/space-gallery
      - run: npm test
        working-directory: docs/redesign/prototypes/space-gallery
      - run: npm run build
        working-directory: docs/redesign/prototypes/space-gallery
      - run: npm run check:build
        working-directory: docs/redesign/prototypes/space-gallery
